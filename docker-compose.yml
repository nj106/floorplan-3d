services:
  floorplan-3d:
    image: ghcr.io/nj106/floorplan-3d:latest
    container_name: floorplan-3d
    labels:
      - com.centurylinklabs.watchtower.enable=true
    network_mode: bridge
    ports:
      - "8093:80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
